<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Angel Tool - Compare Players Buildings</title>

<link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>

<style>
body {
    font-family: system-ui, sans-serif;
    padding: 20px;
}

h2 {
    margin-bottom: 10px;
}

.info {
    margin-bottom: 20px;
    font-size: 15px;
}

.info div {
    margin-bottom: 4px;
}

div.dt-container {
    width: 100%;
}

table.dataTable {
    width: auto !important;
    margin: 0 !important;
    font-size: 13px;
}

table.dataTable th,
table.dataTable td {
    white-space: nowrap;
}

table.dataTable thead th > span.dt-column-order {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    margin: 0 !important;
}

table.dataTable thead th .dt-column-order {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
}

td.center {
    text-align: center;
}

.status-yes {
    color: green;
    font-weight: bold;
}

.status-no {
    color: red;
    font-weight: bold;
}

.menu {
    margin-bottom: 20px;
}

.menu button {
    padding: 8px 16px;
    margin-right: 5px;
    cursor: pointer;
}
</style>

<script>
$(document).ready(function () {

    fetch("/api/users-buildings-summary")
        .then(response => {
            if (!response.ok)
                throw Error(response.statusText);

            return response.json();
        })
        .then(data => {

            const players = Object.keys(data).sort();

            // lista wszystkich budynków
            const allBuildings = new Set();

            players.forEach(player => {
                Object.keys(data[player].buildings).forEach(name => {
                    allBuildings.add(name);
                });
            });

            // wiersze
            const rows = [];

            Array.from(allBuildings)
                .sort()
                .forEach(building => {

                    const row = {
                        building: building
                    };

                    players.forEach(player => {
                        row[player] =
                            data[player].buildings[building] ?? 0;
                    });

                    rows.push(row);
                });

            const columns = [
                {
                    data: "building",
                    title: "Building"
                }
            ];

            players.forEach(player => {
                columns.push({
                    data: player,
                    title: `
                        ${player} (${data[player].level})<br>
                        <span style="font-size:11px;font-weight:normal;color:#777">
                            ${data[player].datetime.substring(0, 10)}
                        </span>
                    `,
                    className: "center"
                });
            });

            $("#buildings").DataTable({

                data: rows,

                columns: columns,

                paging: false,

                autoWidth: false,

                scrollX: true,

                columnDefs: [
                    {
                        targets: "_all",
                        orderSequence: ["asc", "desc"]
                    }
                ],

                layout: {
                    topStart: "search",
                    topEnd: null
                },

                order: [[0, "asc"]]
            });

        })
        .catch(err => {
            console.error(err);
            alert("Cannot load data from API.");
        });

});
</script>

</head>

<body>

<div class="menu">
    <button onclick="window.location.href='/'">Activity (table)</button>
    <button onclick="window.location.href='/guild_quest'">Guild Quests</button>
    <button onclick="window.location.href='/buildings'">Building list</button>
    <button onclick="window.location.href='/resources'">Player resources</button>
    <button onclick="window.location.href='/compare'">Compare Players</button>
</div>

<h2>Compare Players Buildings</h2>

<table id="buildings" class="display"></table>

</body>
</html>
