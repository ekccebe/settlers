<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Settlers App</title>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>

<style>
    body {
        font-family: system-ui, sans-serif;
        padding: 20px;
    }

    table {
        border-collapse: collapse;
    }

    th,
    td {
        padding: 4px;
        text-align: center;
        font-size: 13px;
    }

    th {
        font-weight: 600;
        color: #555;
    }
    th.day {
    width: 14px;
    height: 20px;
    padding: 0;
    font-size: 9px;
    line-height: 1;
    vertical-align: middle;
    }

    .th-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    }
    .user {
        text-align: right;
        padding-right: 10px;
        white-space: nowrap;
    }

    .cell {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: #b0b0b0;
    }

    td.empty-day {
        background: #8aa8f2;
    }

    .cell.online {
        background: #40c463;
    }

    .cell.offline {
        background: #e5533d;
    }

    .cell:hover {
        outline: 1px solid #555;
        cursor: pointer;
    }

    .percentage {
        margin-left: 6px;
        font-size: 0.85em;
        color: #777;
    }

    .menu {
        margin-bottom: 20px;
    }

    .menu button {
        padding: 8px 16px;
        margin-right: 5px;
        cursor: pointer;
    }

    #activity-last-seen td:first-child,
    #activity-last-seen th:first-child {
        text-align: left;
    }
    #activity-last-seen th {
        background-color:#EEE;
    }
</style>



<script>
$(document).ready(function(){


    function getActivityPercentage(activity, days) {
        let online = 0;
        let total = 0;

        days.forEach(day => {
            if (!activity[day]) return; // ignore missing days

            total++;
            if (activity[day].online24h) {
                online++;
            }
        });

        return total === 0 ? 0 : Math.round((online / total) * 100);
    }

    fetch("/api/guild-user-summary", {method: "GET"})
    .then(res => {
        if (!res.ok) throw Error(res.statusText);
        return res.json();
    })
    .then(data => {
        const allDates = [...new Set(
            Object.values(data).flatMap(user => Object.keys(user))
        )].sort();

        const minDate = new Date(allDates[0]);
        const maxDate = new Date(allDates[allDates.length - 1]);

        const days = [];
        let current = new Date(maxDate);

        while (current >= minDate) {
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            const d = String(current.getDate()).padStart(2, '0');

            days.push(`${y}-${m}-${d}`);

            current.setDate(current.getDate() - 1);
        }

        const table = document.getElementById('activity');

        const header = document.createElement('tr');
        header.innerHTML =
        `<th></th>` +
        days.map(d => {
            const [, month, day] = d.split('-');
            return `
            <th class="day" title="${d}">
                <div class="th-date">
                <div>${day}</div>
                <div>${month}</div>
                </div>
            </th>
            `;
        }).join('');
        table.appendChild(header);


        const lastDay = days[0];

        const users = Object.entries(data)
        .map(([user, activity]) => ({
            user,
            activity,
            percentage: getActivityPercentage(activity, days),
            active: !!activity[lastDay] // true if present on last day
        }))
        .sort((a, b) => a.percentage - b.percentage);

        const activeUsers = users.filter(u => u.active);
        const formerUsers = users.filter(u => !u.active);

        function renderRows(list, title) {

            const sectionHeader = document.createElement('tr');
            sectionHeader.innerHTML = `
                <td colspan="${days.length + 1}" style="text-align:left;font-weight:bold;padding-top:10px">
                    ${title}
                </td>`;
            if (title !== "") table.appendChild(sectionHeader);

            list.forEach(({ user, activity, percentage }) => {

                const row = document.createElement('tr');

                row.innerHTML = `
                    <td class="user">
                        ${user}
                        <span class="percentage">${percentage}%</span>
                    </td>
                ` +
                days.map(day => {

                    const entry = activity[day];
                    const isEmptyDay = !Object.values(data).some(user => user[day]);

                    // 👉 jeśli to pusty dzień — zwróć pustą komórkę
                    if (isEmptyDay) {
                        return `<td class="empty-day"></td>`;
                    }

                    if (!entry) {
                        return `
                            <td>
                                <div class="cell" title="${user} • ${day} • no data"></div>
                            </td>`;
                    }

                    return `
                        <td>
                            <div
                                class="cell ${entry.online24h ? 'online' : 'offline'}"
                                title="${user} • ${day} • ${entry.online24h ? 'online' : 'offline'}"
                            ></div>
                        </td>`;
                }).join('');

                table.appendChild(row);
            });
        }

        renderRows(activeUsers, "");
        renderRows(formerUsers, "Players no longer in guild");

        // Last Seen table

        const lastSeenTable = document.getElementById('activity-last-seen');

        const lastSeenUsers = activeUsers.map(({ user, activity }) => {

            let lastOnlineDate = null;

            for (const day of days) { 
                const entry = activity[day];

                if (entry && entry.online24h) {
                    lastOnlineDate = day;
                    break;
                }
            }

            let daysSinceSeen;

            if (!lastOnlineDate) {
                daysSinceSeen = 9999; 
            } else {
                const latestDate = new Date(days[0]);
                const seenDate = new Date(lastOnlineDate);

                daysSinceSeen = Math.floor(
                    (latestDate - seenDate) / (1000 * 60 * 60 * 24)
                );
            }

            return {
                user,
                daysSinceSeen
            };
        })
        .sort((a, b) => b.daysSinceSeen - a.daysSinceSeen);

        // header
        lastSeenTable.innerHTML = `
            <tr>
                <th>Player</th>
                <th>Days since last seen</th>
            </tr>
        `;

        // rows
        lastSeenUsers.forEach(({ user, daysSinceSeen }) => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${user}</td>
                <td>${daysSinceSeen}</td>
            `;

            lastSeenTable.appendChild(row);
        });


    })
    .catch(error => console.log(error));
})
 
function showTab(tabName) {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.style.display = 'none';
    });

    document.getElementById(tabName + '-tab').style.display = 'block';
}
</script>
</head>
<body>

    <div class="menu">
        <button onclick="showTab('activity')">Activity (table)</button>
        <button onclick="showTab('stats')">Activity (last seen)</button>
        <button onclick="window.location.href='/buildings'">Building list</button>
        <button onclick="window.location.href='/resources'">Player resources</button>
        <button onclick="window.location.href='/compare'">Compare Players</button>
    </div>

    <div id="activity-tab" class="tab">
        <h3>Guild members activity - table</h3>
        <table id="activity"></table>
    </div>

    <div id="stats-tab" class="tab" style="display:none">
        <h3>Guild members activity - last seen</h3>
        <table id="activity-last-seen"></table>
    </div>


</body>
</html>
